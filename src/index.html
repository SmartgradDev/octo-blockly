<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Octo Blockly</title>
  </head>
  <body>
    <div id="pageContainer">
      <div id="outputPane">
        <div id="missionSelectorPane">
          <div>
            <label for="phaseSelect"><strong>Phase:</strong></label>
            <select id="phaseSelect">
              <option value="1">Phase 1: Commands</option>
              <option value="2">Phase 2: Logic</option>
              <option value="3">Phase 3: Programming abstraction</option>
            </select>
          </div>

          <div>
            <label for="missionSelect"><strong>Mission:</strong></label>
            <select id="missionSelect"></select>
          </div>
        </div>
        <h3 id="missionTitle"></h3>
        <div id="missionBadges">
          <span id="conceptsContainer"></span>
        </div>
        <p id="missionDescription"></p>
        <div id="simulatorPane"></div>
        <div id="controlsPane">
          <button id="runBtn">▶ Run</button>
          <button id="resetBtn">↺ Reset Mission</button>
        </div>
        <div id="statusMessage"></div>
        <pre id="generatedCode"><code></code></pre>
        <div id="output"></div>
      </div>
      <div id="blocklyDiv"></div>
    </div>
  </body>
</html>
