<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/play" />
    <title>Redirecting to /play...</title>
    <script>
      // Seamless immediate client redirect preserving hash/search if any
      window.location.replace('/play' + window.location.search + window.location.hash);
    </script>
    <style>
      body {
        margin: 0;
        background: #0b1120;
        color: #94a3b8;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      a {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to <a href="/play">/play</a>...</p>
  </body>
</html>
